[package]
name = "png2mozjpegd"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
image = { version = "0.25.10", default-features = false, features = [ "png" ] }
mozjpeg = "0.10.13"
notify = "8.2.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "macros"] , default-features = false}
serde = { version = "1.0.229" , features = ["derive"] }
serde_yaml = "0.9.34"
once_cell = "1.21.4"
walkdir = "2.5.0"
dirs = "7.0.0"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
